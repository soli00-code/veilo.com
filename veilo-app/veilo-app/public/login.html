<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Veilo</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-shell { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .auth-shell { grid-template-columns: 1fr; } }
  .auth-visual {
    background: var(--gradient-dusk); color: #fff; padding: var(--sp-8); position: relative;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  }
  @media (max-width: 900px) { .auth-visual { display: none; } }
  .auth-visual .blob { position: absolute; }
  .auth-form-wrap { display: flex; align-items: center; justify-content: center; padding: var(--sp-6); }
  .auth-form { width: 100%; max-width: 380px; }
  .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-7); }
  .auth-brand span { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
  .quote-block { position: relative; z-index: 2; }
  .quote-block .display-3 { color: #fff; line-height: 1.3; }
  .auth-alt { text-align: center; margin-top: var(--sp-6); font-size: 0.9rem; color: var(--ink-soft); }
  .checkbox-row { display: flex; align-items: center; justify-content: space-between; margin: -8px 0 var(--sp-5); }
  .checkbox-row label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--ink-soft); cursor: pointer; }
  .checkbox-row a { font-size: 0.85rem; font-weight: 700; color: var(--violet); }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="blob blob-3" style="width:120px;height:120px;top:60px;right:60px;"></div>
    <div class="blob blob-2" style="width:80px;height:80px;bottom:120px;left:40px;"></div>
    <a href="index.html" class="auth-brand">
      <svg width="30" height="30" viewBox="0 0 34 34"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF3E7C"/></linearGradient></defs><path d="M17 2c8 0 15 6 15 14s-6 16-15 16S2 24 2 16 9 2 17 2Z" fill="url(#bg2)"/></svg>
      <span>Veilo</span>
    </a>
    <div class="quote-block">
      <p class="display-3">"We talked for three weeks before I knew their name. By then it didn't even feel like the important part."</p>
      <p class="body-sm" style="color:rgba(255,255,255,0.6); margin-top:var(--sp-4);">— a Veilo conversation, still going</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="index.html" class="auth-brand" style="display:none;"></a>
      <h1 class="display-3">Welcome back</h1>
      <p class="body" style="margin-top:var(--sp-2); margin-bottom:var(--sp-6);">Your match is waiting on the other side of this form.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>
        <div class="checkbox-row">
          <label><input type="checkbox" style="accent-color:var(--violet); width:16px; height:16px;" checked disabled> Stay logged in</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log in</button>
      </form>

      <div class="auth-alt">Don't have a Veilo yet? <a href="register.html" id="createOneLink" style="color:var(--violet); font-weight:700;">Create one</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  if (next) {
    document.getElementById('createOneLink').href = 'register.html?next=' + encodeURIComponent(next);
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const submitBtn = document.getElementById('loginSubmit');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';
    try {
      await Veilo.apiFetch('/auth/login', { method: 'POST', body: { email, password } });
      window.location.href = next || 'home.html';
    } catch (err) {
      Veilo.showError(form, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
